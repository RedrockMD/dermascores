<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DermaScores">
<meta name="description" content="DermaScores — clinical dermatology severity scoring calculators for clinicians.">
<title>DermaScores</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"DermaScores","short_name":"DermaScores","start_url":".","display":"standalone","background_color":"%230b1018","theme_color":"%230b1018"}'>
<style>
:root{
  --bg:#0b1018; --bg2:#0e1622; --surface:#141f31; --surface2:#1b2841;
  --line:#27374f; --text:#e9eef7; --muted:#94a4be; --faint:#6b7c98;
  --accent:#5b8cff; --accent2:#34d8c4;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --info:#60a5fa;
  --r:16px; --r2:12px;
  --sh:0 10px 30px rgba(0,0,0,.40);
  color-scheme:dark;
}
.light{
  --bg:#eef1f6; --bg2:#e6ebf2; --surface:#ffffff; --surface2:#f4f6fb;
  --line:#dde3ec; --text:#101a2c; --muted:#5b6b86; --faint:#8a98ae;
  --sh:0 10px 28px rgba(25,45,85,.10);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 100% -10%,rgba(91,140,255,.10),transparent),
                   radial-gradient(700px 500px at -10% 0%,rgba(52,216,196,.08),transparent);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
h1,h2,h3{line-height:1.25}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand svg{width:34px;height:34px;flex:none;border-radius:10px;box-shadow:0 4px 12px rgba(91,140,255,.35)}
.brand .nm{font-weight:800;font-size:19px;letter-spacing:-.3px}
.brand .nm b{color:var(--accent)}
.hbtns{display:flex;gap:8px}
.iconbtn{
  display:flex;align-items:center;justify-content:center;
  min-width:42px;height:42px;padding:0 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);
  font-weight:700;font-size:14px;transition:.15s;
}
.iconbtn:active{transform:scale(.93)}
.iconbtn:hover{border-color:var(--accent)}

/* ---------- Layout ---------- */
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 40px}

/* ---------- Home ---------- */
.hero{margin:6px 2px 18px}
.hero h1{font-size:clamp(24px,6vw,34px);font-weight:850;letter-spacing:-.6px}
.hero p{color:var(--muted);margin-top:5px;font-size:14.5px}
.search{position:relative;margin:14px 0}
.search input{
  width:100%;height:50px;padding:0 16px 0 46px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  color:var(--text);font-size:15.5px;outline:none;transition:.15s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.18)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:650;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:.15s;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:active{transform:scale(.95)}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));margin-top:6px}
.ccard{
  text-align:left;padding:15px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--cc,var(--accent));
  transition:.15s;display:flex;flex-direction:column;gap:5px;min-height:118px;
}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--cc,var(--accent))}
.ccard:active{transform:scale(.97)}
.ccard .ab{font-size:19px;font-weight:850;letter-spacing:-.4px}
.ccard .fn{font-size:12.5px;color:var(--muted);flex:1}
.ccard .tg{
  align-self:flex-start;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  padding:3px 8px;border-radius:6px;color:var(--cc,var(--accent));
  background:color-mix(in srgb,var(--cc,var(--accent)) 16%,transparent);
}
/* which published criteria sets a disease card offers */
.ccard .sets{font-size:11px;color:var(--faint);line-height:1.4;margin-top:-2px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}

/* ---------- Detail ---------- */
.back{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--muted);font-weight:650;font-size:14px;padding:8px 0;margin-bottom:4px;
}
.back:hover{color:var(--accent)}
.dhead h1{font-size:27px;font-weight:850;letter-spacing:-.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dhead .tg{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  padding:4px 9px;border-radius:7px;color:var(--cc);
  background:color-mix(in srgb,var(--cc) 16%,transparent);
}
.dhead .dfull{color:var(--muted);font-size:14.5px;margin-top:3px}
details.about{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
details.about summary{
  padding:11px 14px;font-weight:650;font-size:13.5px;color:var(--muted);
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;
}
details.about summary::-webkit-details-marker{display:none}
details.about summary::before{content:"ⓘ";color:var(--accent);font-size:15px}
details.about[open] summary{border-bottom:1px solid var(--line)}
details.about .ab-body{padding:12px 14px;font-size:13.5px;color:var(--muted)}
details.about .ab-body .rg{margin-top:8px;color:var(--text);font-weight:650;font-size:13px}

.ptrow{margin:14px 0 4px}
.ptrow input{
  width:100%;height:46px;padding:0 14px;background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--r2);color:var(--text);font-size:14.5px;outline:none;
}
.ptrow input:focus{border-style:solid;border-color:var(--accent)}

/* ---------- Form blocks ---------- */
.blocks{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin:14px 0 0}
.block{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;
}
.block.full{grid-column:1/-1}
.block .bt{font-weight:750;font-size:15px;margin-bottom:3px}
.block .bn{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.block .bn:last-child{margin-bottom:0}
.fields{display:grid;gap:11px}
.fields.c2{grid-template-columns:1fr 1fr}
.fields.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:520px){.fields.c3{grid-template-columns:1fr 1fr}}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.fld>span b{color:var(--accent);font-weight:800}
.fld small{font-size:11.5px;color:var(--faint)}
.fld select,.fld input[type=number]{
  width:100%;height:44px;padding:0 12px;border-radius:11px;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  font-size:15px;outline:none;transition:.12s;
}
.fld select:focus,.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.16)}
.fld input[type=range]{width:100%;height:44px;accent-color:var(--accent);background:transparent}

/* ---------- Result bar ---------- */
.resultbar{
  position:sticky;bottom:0;z-index:40;margin-top:16px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:13px 15px calc(13px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.rb-score{display:flex;flex-direction:column;line-height:1.05}
.rb-score .lb{font-size:10.5px;font-weight:750;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.rb-score .vl{font-size:34px;font-weight:850;letter-spacing:-1px}
.rb-mid{flex:1;min-width:140px;display:flex;flex-direction:column;gap:7px}
.pill{
  align-self:flex-start;padding:5px 12px;border-radius:999px;font-weight:750;font-size:13px;
  border:1px solid transparent;
}
.pill.b-ok{background:color-mix(in srgb,var(--ok) 20%,transparent);border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok)}
.pill.b-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn)}
.pill.b-bad{background:color-mix(in srgb,var(--bad) 20%,transparent);border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.pill.b-info{background:color-mix(in srgb,var(--info) 20%,transparent);border-color:color-mix(in srgb,var(--info) 55%,transparent);color:var(--info)}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.parts span{
  font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:7px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
}
.rb-act{display:flex;gap:7px}
.actbtn{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--line);transition:.13s;
}
.actbtn svg{width:19px;height:19px}
.actbtn:hover{border-color:var(--accent);color:var(--accent)}
.actbtn:active{transform:scale(.9)}
.actbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- Footer ---------- */
footer{
  max-width:920px;margin:24px auto 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);text-align:center;
}
footer .disc{font-size:11.5px;color:var(--faint);line-height:1.6;max-width:560px;margin:0 auto}
footer .disc b{color:var(--muted)}
footer .sig{margin-top:12px;font-size:12px;color:var(--faint);font-weight:650;letter-spacing:.3px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,28px);
  background:var(--text);color:var(--bg);font-weight:700;font-size:13.5px;
  padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.25s;z-index:200;box-shadow:var(--sh);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Background surgical-instrument texture ---------- */
.bg-deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-deco svg{position:absolute;color:var(--text);opacity:.05}
.light .bg-deco svg{opacity:.075}
@media(max-width:600px){.bg-deco svg{scale:.6}}

/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  header,.resultbar,footer,#toast,.back,.about,.ptrow,.search,.chips,.bg-deco{display:none!important}
  body{background:#fff;color:#000}
  #app{display:none}
  #printArea{display:block;padding:0 6px}
  .pr-h{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .pr-h .t{font-size:20px;font-weight:800}
  .pr-meta{font-size:12px;color:#333;margin-bottom:14px;line-height:1.7}
  .pr-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px}
  .pr-tbl td{border:1px solid #999;padding:6px 9px}
  .pr-tbl td:last-child{text-align:right;font-weight:700;width:90px}
  .pr-sec{font-weight:800;font-size:13px;background:#eee;padding:6px 9px;border:1px solid #999;border-bottom:none}
  .pr-score{font-size:16px;font-weight:800;margin:10px 0;padding:10px;border:2px solid #000}
  .pr-disc{font-size:10px;color:#555;margin-top:18px;border-top:1px solid #999;padding-top:8px}
}

/* ---------- Diagnostic Criteria Assistant ---------- */
.sec-toggle{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.sec-toggle button{padding:7px 12px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sec-toggle button.on{background:var(--accent);color:#fff}

.crit-banner{
  display:flex;align-items:flex-start;gap:8px;
  background:color-mix(in srgb,var(--warn) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  color:var(--text);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin:12px 0;
}
.crit-banner b{color:var(--warn)}

.crit-groups{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.crit-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.crit-group-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.crit-group-h .gt{font-weight:750;font-size:14px}
.crit-group-h .gn{font-size:11.5px;color:var(--muted);white-space:nowrap}
.crit-item{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:9px;cursor:pointer}
.crit-item:hover{background:var(--surface2)}
.crit-item input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.crit-item span{font-size:14px;line-height:1.4}
.crit-item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.crit-result{margin-top:16px;padding:16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.crit-result.met{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.crit-result .rv{font-size:19px;font-weight:850}
.crit-result.met .rv{color:var(--ok)}
.crit-result .rd{font-size:13px;color:var(--muted);line-height:1.5}

.crit-next{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.crit-next .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.crit-next .col h4{font-size:13px;font-weight:750;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.crit-next .col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.crit-next .col li{font-size:13px;line-height:1.4;color:var(--text)}

.crit-diff{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.crit-diff h4{font-size:13px;font-weight:750;margin-bottom:8px}
.crit-diff ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.crit-diff li{font-size:13px;color:var(--muted)}

.crit-refs{margin-top:14px;font-size:11.5px;color:var(--faint);line-height:1.6}
.crit-setname{font-size:12.5px;color:var(--muted);margin-top:2px}

/* criteria-set tabs (a disease may offer several published criteria sets) */
.crit-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.crit-tab{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer}
.crit-tab.on{background:var(--cc,var(--accent));border-color:transparent;color:#0b1018}

.crit-note{margin-top:8px;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;
  color:var(--muted);background:color-mix(in srgb,var(--accent) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}

/* dropdown criteria (ALDEN / RegiSCAR style graded items) */
.crit-item.choice{display:flex;flex-direction:column;align-items:stretch;gap:7px}
.crit-item.choice .cl{font-size:14px;line-height:1.4;font-weight:600}
.crit-item.choice select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit;font-size:13.5px}
.crit-hint{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:400}

/* hand-off to calculators that already exist in the Scores section */
.crit-related{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.crit-related h4{font-size:13px;font-weight:750;margin-bottom:9px}
.crit-related h4 small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.crit-related .rl{display:flex;flex-wrap:wrap;gap:8px}
.relbtn{display:flex;flex-direction:column;gap:2px;text-align:left;padding:9px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px;
  font-weight:750;cursor:pointer}
.relbtn:hover{border-color:var(--cc,var(--accent))}
.relbtn span{font-size:11.5px;font-weight:400;color:var(--muted)}

@media print{
  .crit-banner,.sec-toggle,.crit-tabs,.crit-related{display:none!important}
  .pr-crit-groups{margin:10px 0}
  .pr-crit-g{font-weight:800;font-size:12px;margin:8px 0 3px}
  .pr-crit-item{font-size:11.5px;padding:2px 0}
  .pr-crit-item.on{font-weight:700}
  .pr-crit-item .ck{display:inline-block;width:12px}
  .pr-next{margin-top:10px}
  .pr-next h5{font-size:11.5px;font-weight:800;margin:8px 0 3px}
  .pr-next ul{margin:0 0 0 16px;padding:0;font-size:11px}
}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   DermaScores — clinical dermatology scoring calculators
   Single file · zero dependencies · offline-ready
   ===================================================================== */

/* ---------- state ---------- */
const state={lang:"tr",theme:"dark",section:"calc",view:"home",calc:null,query:"",cat:"all",
             critView:"home",critId:null,critQuery:"",critCat:"all",critSet:0};
let critChecked=new Set();   /* ids of ticked checkbox criteria */
let critChoice={};           /* id -> selected option index, for type:"choice" criteria */

/* ---------- i18n helper ---------- */
const t=(tr,en)=>state.lang==="tr"?tr:en;

/* ---------- UI strings ---------- */
const UI={
  tagline:["Klinik dermatoloji şiddet skorlama araçları","Clinical dermatology severity scoring tools"],
  search:["Skor ara…","Search scores…"],
  all:["Tümü","All"],
  none:["Sonuç bulunamadı","No scores found"],
  back:["Geri","Back"],
  about:["Bilgi & yorumlama","About & interpretation"],
  range:["Aralık","Range"],
  patient:["Hasta adı / no — rapor için (opsiyonel)","Patient name / ID — for report (optional)"],
  score:["Skor","Score"],
  reset:["Sıfırla","Reset"],
  copy:["Kopyala","Copy"],
  print:["PDF / Yazdır","PDF / Print"],
  copied:["Sonuç panoya kopyalandı","Result copied to clipboard"],
  cleared:["Alanlar sıfırlandı","Inputs reset"],
  disc:["<b>Tıbbi sorumluluk reddi.</b> Bu uygulama yalnızca eğitim ve klinik karar desteği amaçlıdır; profesyonel tıbbi değerlendirmenin yerine geçmez. Sonuçları hastanın klinik bağlamında yorumlayınız.<br><b>Bu bir deneme sürümüdür ve hatalar içerebilir; önemli bilgileri mutlaka ikinci bir kaynaktan kontrol ediniz.</b>",
        "<b>Medical disclaimer.</b> This app is for education and clinical decision support only and is not a substitute for professional medical judgment. Interpret all results within the patient's clinical context.<br><b>This is a trial/beta version and may contain errors; please double-check any important information.</b>"],
  reportTitle:["DermaScores — Klinik Skor Raporu","DermaScores — Clinical Score Report"],
  date:["Tarih","Date"],
  result:["Sonuç","Result"],
  interp:["Yorum","Interpretation"]
};

/* ---------- Diagnostic Criteria Assistant — UI strings ---------- */
const CRIT_UI={
  navLabel:["Tanı Kriterleri","Diagnostic Criteria"],
  calcNavLabel:["Skorlar","Calculators"],
  title:["Tanı Kriterleri Asistanı","Diagnostic Criteria Assistant"],
  tagline:["Resmi tanı kriterlerine göre hızlı checklist ve klinik yönlendirme","Quick checklist and clinical guidance based on formal diagnostic criteria"],
  search:["Hastalık ara…","Search disease…"],
  banner:["<b>Klinik karar desteği.</b> Bu araç hekim değerlendirmesinin yerini tutmaz; hasta karşısında hekim tarafından doldurulan bir hatırlatma/checklist aracıdır.",
          "<b>Clinical decision support.</b> This tool does not replace physician judgment; it is a checklist/reminder aid meant to be filled in by a physician at the point of care."],
  criteriaSetLabel:["Kriter Seti","Criteria Set"],
  met:["Kriterleri karşılıyor","Meets criteria"],
  notMet:["Kriterleri karşılamıyor","Does not meet criteria"],
  score:["Puan","Score"],
  nextSteps:["Sıradaki Adımlar","Next Steps"],
  workup:["Tetkik","Workup"],
  treatment:["Tedavi Yönelimi","Treatment Orientation"],
  referral:["Sevk Kriterleri","Referral Criteria"],
  differentials:["Sık Karışan Ayırıcı Tanılar","Common Differential Diagnoses"],
  references:["Kaynaklar","References"],
  reset:["Sıfırla","Reset"],
  print:["PDF / Yazdır","PDF / Print"],
  reportTitle:["Tanı Kriterleri Değerlendirme Raporu","Diagnostic Criteria Assessment Report"],
  none:["Sonuç bulunamadı","No results found"],
  all:["Tümü","All"],
  relatedCalcs:["İlgili skorlar","Related scores"],
  relatedHint:["Bu araçlar Skorlar bölümünde hazır — tıklayınca oraya geçer","These tools live in the Calculators section — click to jump there"],
  mandatoryMissing:["Zorunlu kriter işaretlenmedi","Mandatory criterion not ticked"]
};

/* ---------- categories ---------- */
const CATS={
  pso :["Psoriazis","Psoriasis","#5b8cff"],
  ecz :["Egzama","Eczema","#34d8c4"],
  acne:["Akne","Acne","#f59e0b"],
  hs  :["Hidradenitis","Hidradenitis","#f472b6"],
  urt :["Ürtiker","Urticaria","#a78bfa"],
  pig :["Pigmentasyon","Pigmentation","#22d3ee"],
  hair:["Saç","Hair","#fb923c"],
  bul :["Büllöz","Bullous","#fbbf24"],
  ctd :["Bağ dokusu","Connective tissue","#818cf8"],
  ctcl:["Kutanöz lenfoma","Cutaneous lymphoma","#c084fc"],
  emg :["Acil","Emergency","#fb7185"],
  itch:["Kaşıntı","Pruritus","#4ade80"],
  gen :["Genel","General","#94a3b8"],
  im  :["Dahiliye","Internal medicine","#2dd4bf"]
};

/* ---------- diagnostic-criteria categories ---------- */
const CRIT_CATS={
  neut:["Nötrofilik dermatoz","Neutrophilic dermatosis","#f97316"],
  vasc:["Vaskülit / Otoinflamatuar","Vasculitis / Autoinflammatory","#e11d48"],
  bulld:["Büllöz","Bullous","#fbbf24"],
  drug :["Ciddi ilaç reaksiyonu","Severe drug reaction","#dc2626"],
  peds :["Pediatrik vaskülit","Pediatric vasculitis","#22d3ee"],
  hsx  :["Hidradenitis","Hidradenitis","#f472b6"],
  ecz  :["Egzama","Eczema","#34d8c4"],
  arth :["Artropati","Arthropathy","#818cf8"]
};

/* ---------- builders & math helpers ---------- */
const gr=(a,b)=>{if(b===undefined){b=a;a=0;}const o=[];for(let i=a;i<=b;i++)o.push([i,String(i)]);return o;};
const num=(id,label,o={})=>({type:"num",id,label,min:o.min??0,max:o.max??100,step:o.step??1,val:o.val??0,hint:o.hint});
const sel=(id,label,opts,o={})=>({type:"sel",id,label,opts,val:o.val??(Array.isArray(opts[0])?opts[0][0]:opts[0]),hint:o.hint});
const rng=(id,label,o={})=>({type:"rng",id,label,min:o.min??0,max:o.max??10,step:o.step??1,val:o.val??0});
const blk=(title,items,o={})=>({title,items,note:o.note,full:o.full,cols:o.cols});
const note=txt=>({note:txt,items:[],full:true});

/* PASI/EASI/PSSI involved-area grade (0–6) as a % range dropdown */
const areaOpts=()=>[0,1,2,3,4,5,6].map(n=>[n,t(
  ["0 — %0 (yok)","1 — <%10","2 — %10–29","3 — %30–49","4 — %50–69","5 — %70–89","6 — %90–100"][n],
  ["0 — 0% (none)","1 — <10%","2 — 10–29%","3 — 30–49%","4 — 50–69%","5 — 70–89%","6 — 90–100%"][n])]);
/* severity band: arr of [upperInclusive,cls,tr,en]; last entry catches the rest */
const band=(x,arr)=>{for(const e of arr){if(x<=e[0])return{cls:e[1],txt:t(e[2],e[3])};}const l=arr[arr.length-1];return{cls:l[1],txt:t(l[2],l[3])};};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* =====================================================================
   CALCULATOR DEFINITIONS
   Each: {id,cat,name,full:[tr,en],about:[tr,en],range,form(),calc(v)}
   form() -> array of blocks ; calc(v) -> {score,fmt?,band?,parts?}
   v(id) returns the raw string value of an input.
   ===================================================================== */
const CALCS=[

/* ---- PASI ---- */
{
 id:"PASI",cat:"pso",name:"PASI",
 full:["Psoriazis Alan ve Şiddet İndeksi","Psoriasis Area and Severity Index"],
 about:["Psoriaziste 4 vücut bölgesinde eritem, endürasyon (kalınlık) ve deskuamasyonu (0–4) ve tutulan alanı birleştiren standart şiddet ölçümü. PASI ≥10 genellikle sistemik tedavi adayını gösterir (\"onlar kuralı\").",
        "Standard psoriasis severity measure combining erythema, induration and desquamation (0–4) with involved area across 4 body regions. PASI ≥10 generally indicates a systemic-therapy candidate (\"rule of tens\")."],
 range:"0–72",
 form(){
   const R=[["h","Baş & boyun","Head & neck"],["u","Üst ekstremiteler","Upper limbs"],["t","Gövde","Trunk"],["l","Alt ekstremiteler","Lower limbs"]];
   return [
     note(t("Her bölge için eritem, endürasyon ve deskuamasyonu (0–4) ve tutulan alan derecesini (% aralığı) seçin.",
            "For each region select erythema, induration and desquamation (0–4) and the involved-area grade (% range).")),
     ...R.map(([k,tr,en])=>blk(t(tr,en),[
       sel(k+"e",t("Eritem (kızarıklık)","Erythema"),gr(4)),
       sel(k+"i",t("Endürasyon (kalınlık)","Induration"),gr(4)),
       sel(k+"d",t("Deskuamasyon (pullanma)","Desquamation"),gr(4)),
       sel(k+"a",t("Tutulan alan","Involved area"),areaOpts())
     ]))
   ];
 },
 calc(v){
   const W={h:.1,u:.2,t:.3,l:.4};let s=0;
   for(const k in W)s+=(+v(k+"e")+ +v(k+"i")+ +v(k+"d"))*(+v(k+"a"))*W[k];
   return {score:s,fmt:s.toFixed(1),
     band:band(s,[[10,"ok","Hafif","Mild"],[20,"warn","Orta","Moderate"],[Infinity,"bad","Şiddetli","Severe"]])};
 }
},

/* ---- PSSI ---- */
{
 id:"PSSI",cat:"pso",name:"PSSI",
 full:["Saçlı Deri Psoriazis Şiddet İndeksi","Psoriasis Scalp Severity Index"],
 about:["Saçlı deri psoriazisinde eritem, endürasyon ve deskuamasyon (0–4) toplamının saçlı deri tutulum alanı derecesi (0–6) ile çarpımı.",
        "Scalp psoriasis severity: the sum of erythema, induration and desquamation (0–4) multiplied by the scalp area grade (0–6)."],
 range:"0–72",
 form(){
   return [blk(t("Saçlı deri","Scalp"),[
     sel("e",t("Eritem","Erythema"),gr(4)),
     sel("i",t("Endürasyon","Induration"),gr(4)),
     sel("d",t("Deskuamasyon","Desquamation"),gr(4)),
     sel("a",t("Tutulan saçlı deri","Involved scalp"),areaOpts())
   ])];
 },
 calc(v){
   const s=(+v("e")+ +v("i")+ +v("d"))*(+v("a"));
   return {score:s,fmt:String(s),
     band:band(s,[[12,"ok","Hafif","Mild"],[30,"warn","Orta","Moderate"],[Infinity,"bad","Şiddetli","Severe"]])};
 }
},

/* ---- NAPSI ---- */
{
 id:"NAPSI",cat:"pso",name:"NAPSI",
 full:["Tırnak Psoriazisi Şiddet İndeksi","Nail Psoriasis Severity Index"],
 about:["Her tırnak 4 kadrana bölünür. Tırnak matriksi bulguları (çukurlaşma, lökonişi, lunulada kırmızı nokta, ufalanma) kaç kadranda görülürse 0–4; tırnak yatağı bulguları (onikoliz, yağ damlası lekesi, splinter kanama, subungual hiperkeratoz) 0–4. 10 el tırnağı toplamı 0–80.",
        "Each nail is divided into 4 quadrants. Matrix features (pitting, leukonychia, red spots in the lunula, crumbling) score 0–4 by quadrants involved; nail-bed features (onycholysis, oil-drop discolouration, splinter haemorrhage, subungual hyperkeratosis) score 0–4. Total across 10 fingernails 0–80."],
 range:"0–80",
 form(){
   const N=[["Sağ başparmak","Right thumb"],["Sağ işaret","Right index"],["Sağ orta","Right middle"],["Sağ yüzük","Right ring"],["Sağ serçe","Right little"],
            ["Sol başparmak","Left thumb"],["Sol işaret","Left index"],["Sol orta","Left middle"],["Sol yüzük","Left ring"],["Sol serçe","Left little"]];
   return N.map(([tr,en],i)=>blk(t(tr,en),[
     sel("m"+i,t("Matriks","Matrix"),gr(4)),
     sel("b"+i,t("Yatak","Bed"),gr(4))
   ]));
 },
 calc(v){
   let s=0;for(let i=0;i<10;i++)s+=+v("m"+i)+ +v("b"+i);
   return {score:s,fmt:String(s),
     band:band(s,[[0,"ok","Tutulum yok","No involvement"],[20,"ok","Hafif","Mild"],[40,"warn","Orta","Moderate"],[Infinity,"bad","Şiddetli","Severe"]])};
 }
},

/* ---- BSA ---- */
{
 id:"BSA",cat:"gen",name:"BSA",
 full:["Vücut Yüzey Alanı","Body Surface Area"],
 about:["Tutulan vücut yüzey alanı yüzdesi. Dokuzlar kuralı ile her bölgenin tutulum yüzdesi girilir. Pratik kural: hastanın bir avuç içi ≈ %1 BSA. Psoriazis/egzemada <%3 sınırlı, %3–10 orta, >%10 yaygın kabul edilir.",
        "Percentage of body surface area involved. Enter the involved percentage of each region using the rule of nines. Practical rule: the patient's palm ≈ 1% BSA. For psoriasis/eczema <3% limited, 3–10% moderate, >10% extensive."],
 range:"0–100%",
 form(){
   const R=[["hn","Baş & boyun (9%)","Head & neck (9%)"],["ra","Sağ kol (9%)","Right arm (9%)"],
            ["la","Sol kol (9%)","Left arm (9%)"],["at","Ön gövde (18%)","Anterior trunk (18%)"],
            ["pt","Arka gövde (18%)","Posterior trunk (18%)"],["rl","Sağ bacak (18%)","Right leg (18%)"],
            ["ll","Sol bacak (18%)","Left leg (18%)"],["ge","Genital (1%)","Genitalia (1%)"]];
   return [
     note(t("Her bölge için o bölgenin tutulum yüzdesini (0–100) girin.","Enter the involved percentage (0–100) of each region.")),
     blk(t("Dokuzlar kuralı","Rule of nines"),R.map(([k,tr,en])=>num(k,t(tr,en),{max:100})),{cols:2})
   ];
 },
 calc(v){
   const W={hn:9,ra:9,la:9,at:18,pt:18,rl:18,ll:18,ge:1};let s=0;
   for(const k in W)s+=W[k]*clamp(+v(k)||0,0,100)/100;
   s=clamp(s,0,100);
   return {score:s,fmt:s.toFixed(1)+"%",
     band:band(s,[[3,"ok","Sınırlı","Limited"],[10,"warn","Orta","Moderate"],[Infinity,"bad","Yaygın","Extensive"]])};
 }
},

/* ---- EASI ---- */
{
 id:"EASI",cat:"ecz",name:"EASI",
 full:["Egzama Alan ve Şiddet İndeksi","Eczema Area and Severity Index"],
 about:["Atopik dermatitte 4 bölgede eritem, ödem/papülasyon, ekskoriasyon ve likenifikasyonu (0–3) ve tutulan alanı birleştirir. Bölge ağırlıkları yaşa göre değişir (8 yaş altında baş ve ekstremiteler farklı). Yorum: 0 temiz, 0.1–1 neredeyse temiz, 1.1–7 hafif, 7.1–21 orta, 21.1–50 şiddetli, >50 çok şiddetli.",
        "Atopic dermatitis severity combining erythema, edema/papulation, excoriation and lichenification (0–3) with involved area across 4 regions. Regional weights are age-dependent (head and limbs differ under age 8). Interpretation: 0 clear, 0.1–1 almost clear, 1.1–7 mild, 7.1–21 moderate, 21.1–50 severe, >50 very severe."],
 range:"0–72",
 form(){
   const R=[["h","Baş & boyun","Head & neck"],["u","Üst ekstremiteler","Upper limbs"],["t","Gövde","Trunk"],["l","Alt ekstremiteler","Lower limbs"]];
   return [
     blk("",[sel("age",t("Yaş grubu","Age group"),
        [["adult",t("≥ 8 yaş — erişkin ağırlıkları","≥ 8 years — adult weights")],
         ["child",t("< 8 yaş — bebek/çocuk ağırlıkları","< 8 years — infant weights")]])],
        {full:true,note:t("Bölge ağırlıkları yaşa göre belirlenir.","Regional weighting depends on age.")}),
     ...R.map(([k,tr,en])=>blk(t(tr,en),[
       sel(k+"e",t("Eritem","Erythema"),gr(3)),
       sel(k+"d",t("Ödem / papülasyon","Edema / papulation"),gr(3)),
       sel(k+"x",t("Ekskoriasyon","Excoriation"),gr(3)),
       sel(k+"l",t("Likenifikasyon","Lichenification"),gr(3)),
       sel(k+"a",t("Tutulan alan","Involved area"),areaOpts())
     ]))
   ];
 },
 calc(v){
   const W=v("age")==="child"?{h:.2,u:.2,t:.3,l:.3}:{h:.1,u:.2,t:.3,l:.4};
   let s=0;
   for(const k in W)s+=(+v(k+"e")+ +v(k+"d")+ +v(k+"x")+ +v(k+"l"))*(+v(k+"a"))*W[k];
   return {score:s,fmt:s.toFixed(1),
     band:band(s,[[0,"info","Temiz","Clear"],[1,"ok","Neredeyse temiz","Almost clear"],[7,"ok","Hafif","Mild"],[21,"warn","Orta","Moderate"],[50,"bad","Şiddetli","Severe"],[Infinity,"bad","Çok şiddetli","Very severe"]])};
 }
},

/* ---- SCORAD ---- */
{
 id:"SCORAD",cat:"ecz",name:"SCORAD",
 full:["Atopik Dermatit Skorlaması","Scoring Atopic Dermatitis"],
 about:["SCORAD = A/5 + 7·B/2 + C. A: tutulan alan (% BSA, dokuzlar kuralı). B: 6 şiddet bulgusu toplamı (her biri 0–3). C: kaşıntı ve uyku kaybı VAS toplamı (0–20). Yorum: <25 hafif, 25–50 orta, >50 şiddetli.",
        "SCORAD = A/5 + 7·B/2 + C. A: extent (% BSA, rule of nines). B: sum of 6 intensity signs (each 0–3). C: VAS sum of pruritus and sleep loss (0–20). Interpretation: <25 mild, 25–50 moderate, >50 severe."],
 range:"0–103",
 form(){
   return [
     blk(t("A — Tutulan alan (dokuzlar kuralı)","A — Extent (rule of nines)"),[
       num("ahn",t("Baş & boyun (9%)","Head & neck (9%)"),{max:100}),
       num("aul",t("Üst ekstremiteler (18%)","Upper limbs (18%)"),{max:100}),
       num("atr",t("Gövde (36%)","Trunk (36%)"),{max:100}),
       num("all",t("Alt ekstremiteler (36%)","Lower limbs (36%)"),{max:100}),
       num("agen",t("Genital (1%)","Genitalia (1%)"),{max:100})
     ],{cols:2,note:t("Her bölgenin tutulum yüzdesini girin.","Enter the involved % of each region.")}),
     blk(t("B — Şiddet (her biri 0–3)","B — Intensity (each 0–3)"),[
       sel("b1",t("Eritem","Erythema"),gr(3)),
       sel("b2",t("Ödem / papülasyon","Edema / papulation"),gr(3)),
       sel("b3",t("Sızıntı / krut","Oozing / crusts"),gr(3)),
       sel("b4",t("Ekskoriasyon","Excoriation"),gr(3)),
       sel("b5",t("Likenifikasyon","Lichenification"),gr(3)),
       sel("b6",t("Kuruluk (etkilenmemiş deri)","Dryness (uninvolved skin)"),gr(3))
     ],{cols:2}),
     blk(t("C — Subjektif belirtiler (son 3 gün)","C — Subjective symptoms (last 3 days)"),[
       rng("c1",t("Kaşıntı (VAS 0–10)","Pruritus (VAS 0–10)"),{max:10}),
       rng("c2",t("Uyku kaybı (VAS 0–10)","Sleep loss (VAS 0–10)"),{max:10})
     ],{cols:2})
   ];
 },
 calc(v){
   const W={ahn:9,aul:18,atr:36,all:36,agen:1};let A=0;
   for(const k in W)A+=W[k]*clamp(+v(k)||0,0,100)/100;
   A=clamp(A,0,100);
   let B=0;for(let i=1;i<=6;i++)B+=+v("b"+i);
   const C=clamp(+v("c1")||0,0,10)+clamp(+v("c2")||0,0,10);
   const s=A/5+7*B/2+C;
   return {score:s,fmt:s.toFixed(1),
     parts:[["A",A.toFixed(1)],["B",String(B)],["C",String(C)]],
     band:band(s,[[25,"ok","Hafif","Mild"],[50,"warn","Orta","Moderate"],[Infinity,"bad","Şiddetli","Severe"]])};
 }
},

/* ---- POEM ---- */
{
 id:"POEM",cat:"ecz",name:"POEM",
 full:["Hasta Odaklı Egzama Ölçütü","Patient-Oriented Eczema Measure"],
 about:["Hastanın son 1 haftada egzama belirtilerini kaç gün yaşadığını ölçen 7 maddelik anket (her madde 0–4). Yorum: 0–2 temiz/neredeyse temiz, 3–7 hafif, 8–16 orta, 17–24 şiddetli, 25–28 çok şiddetli.",
        "A 7-item patient questionnaire scoring how many days over the last week eczema symptoms were present (each item 0–4). Interpretation: 0–2 clear/almost clear, 3–7 mild, 8–16 moderate, 17–24 severe, 25–28 very severe."],

/* ---- SCORTEN ---- */
{
 id:"SCORTEN",cat:"emg",name:"SCORTEN",
 full:["Toksik Epidermal Nekroliz Şiddet Skoru","Toxic Epidermal Necrolysis Severity Score"],
 about:["Stevens-Johnson sendromu / toksik epidermal nekrolizde hastaneye yatışın ilk 24 saatinde değerlendirilen 7 ölçütlü mortalite tahmin skoru. Tahmini mortalite: 0–1 %3.2, 2 %12.1, 3 %35.3, 4 %58.3, ≥5 %90.",
        "A 7-criterion mortality-prediction score for Stevens-Johnson syndrome / toxic epidermal necrolysis, assessed within the first 24 hours of admission. Predicted mortality: 0–1 3.2%, 2 12.1%, 3 35.3%, 4 58.3%, ≥5 90%."],
 range:"0–7",
 form(){

            ["c2","Eşlik eden malignite","Concurrent malignancy"],
            ["c3","Kalp hızı ≥ 120/dk","Heart rate ≥ 120 bpm"],
            ["c4","Epidermal ayrılma > %10 BSA","Epidermal detachment > 10% BSA"],

            ["c6","Serum bikarbonat < 20 mmol/L","Serum bicarbonate < 20 mmol/L"],

{

   const deg=[1,2,3,4,5].map(n=>[n,t(
     ["1 — Yok","2 — Hafif","3 — Orta","4 — Şiddetli","5 — Dayanılmaz"][n-1],
     ["1 — Not present","2 — Mild","3 — Moderate","4 — Severe","5 — Unbearable"][n-1])]);
   const dir=[1,2,3,4,5].map(n=>[n,t(
     ["1 — Tamamen geçti","2 — Çok daha iyi","3 — Biraz daha iyi","4 — Değişmedi","5 — Kötüleşiyor"][n-1],
     ["1 — Completely resolved","2 — Much better","3 — A little better","4 — Unchanged","5 — Getting worse"][n-1])]);
   const aff=[1,2,3,4,5].map(n=>[n,t(
     ["1 — Hiç etkilenmedi","2 — Nadiren","3 — Bazen","4 — Sıklıkla","5 — Her zaman"][n-1],

   return [

       sel("deg",t("Derece — kaşıntı şiddeti","Degree — itch intensity"),deg),
       sel("dir",t("Yön — son 2 haftadaki gidişat","Direction — trend over last 2 weeks"),dir)
     ]),
     blk(t("Engellilik — en yüksek puan alınır","Disability — highest score is used"),[
       sel("ds1",t("Uyku","Sleep"),aff),
       sel("ds2",t("Boş zaman / sosyal","Leisure / social"),aff),
       sel("ds3",t("Ev işleri / işler","Housework / errands"),aff),

/* ---- Creatinine Clearance (Cockcroft–Gault) ---- */
{
 id:"CrCl",cat:"im",name:"CrCl",
 full:["Kreatinin Klirensi (Cockcroft–Gault)","Creatinine Clearance (Cockcroft–Gault)"],
 about:["İlaç doz ayarlamasında yaygın kullanılan böbrek fonksiyonu tahmini. CrCl = [(140 − yaş) × ağırlık × (kadında 0.85)] / (72 × serum kreatinin). Sonuç mL/dk olarak verilir.",
        "An estimate of renal function widely used for drug dose adjustment. CrCl = [(140 − age) × weight × (0.85 if female)] / (72 × serum creatinine). Result is in mL/min."],
 form(){
   return [blk(t("Hasta verileri","Patient data"),[
     num("age",t("Yaş (yıl)","Age (years)"),{max:120}),
     num("wt",t("Vücut ağırlığı (kg)","Body weight (kg)"),{max:400,step:0.1}),
     sel("sex",t("Cinsiyet","Sex"),[["m",t("Erkek","Male")],["f",t("Kadın","Female")]]),
     num("cr",t("Serum kreatinin (mg/dL)","Serum creatinine (mg/dL)"),{max:25,step:0.01})
   ],{cols:2})];
 },
 calc(v){
   const age=+v("age"),wt=+v("wt"),cr=+v("cr"),f=v("sex")==="f";
   if(age<=0||wt<=0||cr<=0)return{score:0,fmt:"—"};
   const s=((140-age)*wt*(f?0.85:1))/(72*cr);
   return {score:s,fmt:s.toFixed(1)+t(" mL/dk"," mL/min"),
     band:band(s,[[14.99,"bad","Böbrek yetmezliği","Kidney failure"],[29.99,"bad","Ağır azalma","Severely decreased"],[59.99,"warn","Orta azalma","Moderately decreased"],[89.99,"ok","Hafif azalma","Mildly decreased"],[Infinity,"ok","Normal","Normal"]])};
 }
},

/* ---- eGFR (CKD-EPI 2021) ---- */
{
 id:"eGFR",cat:"im",name:"eGFR",
 full:["Tahmini GFH (CKD-EPI 2021)","Estimated GFR (CKD-EPI 2021)"],
 about:["Kronik böbrek hastalığını evrelemek için kullanılan 2021 ırktan bağımsız CKD-EPI kreatinin denklemi. Sonuç mL/dk/1.73m². KDIGO evreleri: G1 ≥90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29, G5 <15.",
        "The 2021 race-free CKD-EPI creatinine equation used to stage chronic kidney disease. Result in mL/min/1.73m². KDIGO categories: G1 ≥90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29, G5 <15."],
 form(){
   return [blk(t("Hasta verileri","Patient data"),[
     num("age",t("Yaş (yıl)","Age (years)"),{max:120}),
     sel("sex",t("Cinsiyet","Sex"),[["m",t("Erkek","Male")],["f",t("Kadın","Female")]]),
     num("cr",t("Serum kreatinin (mg/dL)","Serum creatinine (mg/dL)"),{max:25,step:0.01})
   ])];
 },
 calc(v){
   const age=+v("age"),cr=+v("cr"),f=v("sex")==="f";
   if(age<=0||cr<=0)return{score:0,fmt:"—"};
   const k=f?0.7:0.9,a=f?-0.241:-0.302;
   const e=142*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.200)*Math.pow(0.9938,age)*(f?1.012:1);
   return {score:e,fmt:Math.round(e)+t(" mL/dk/1.73m²"," mL/min/1.73m²"),
     band:band(e,[[14.99,"bad","G5 — Böbrek yetmezliği","G5 — Kidney failure"],[29.99,"bad","G4 — Ağır azalma","G4 — Severely decreased"],[44.99,"warn","G3b — Orta-ağır azalma","G3b — Moderately-severely decreased"],[59.99,"warn","G3a — Hafif-orta azalma","G3a — Mildly-moderately decreased"],[89.99,"ok","G2 — Hafif azalma","G2 — Mildly decreased"],[Infinity,"ok","G1 — Normal / yüksek","G1 — Normal or high"]])};
 }
},

{

 about:["Karaciğer hastalığında ileri fibrozisi noninvaziv değerlendiren indeks. FIB-4 = (yaş × AST) / (trombosit × √ALT). Yorum: <1.45 düşük risk, 1.45–3.25 belirsiz, >3.25 ileri fibrozis için yüksek risk.",
        "A non-invasive index for advanced fibrosis in liver disease. FIB-4 = (age × AST) / (platelets × √ALT). Interpretation: <1.45 low risk, 1.45–3.25 indeterminate, >3.25 high risk for advanced fibrosis."],
 form(){
   return [blk(t("Laboratuvar","Laboratory"),[
     num("age",t("Yaş (yıl)","Age (years)"),{max:120}),
     num("ast",t("AST (U/L)","AST (U/L)"),{max:5000,step:0.1}),
     num("alt",t("ALT (U/L)","ALT (U/L)"),{max:5000,step:0.1}),
     num("plt",t("Trombosit (×10⁹/L)","Platelets (×10⁹/L)"),{max:1000,step:1})
   ],{cols:2})];
 },

   const s=(age*ast)/(plt*Math.sqrt(alt));
   return {score:s,fmt:s.toFixed(2),
     band:band(s,[[1.45,"ok","Düşük risk — ileri fibrozis olası değil","Low risk — advanced fibrosis unlikely"],[3.25,"warn","Belirsiz aralık","Indeterminate"],[Infinity,"bad","Yüksek risk — ileri fibrozis olası","High risk — advanced fibrosis likely"]])};

/* ---- MELD-Na ---- */
{
 id:"MELD-Na",cat:"im",name:"MELD-Na",
 full:["MELD-Na Karaciğer Hastalığı Skoru","MELD-Na End-Stage Liver Disease Score"],
 about:["Son dönem karaciğer hastalığında kısa dönem mortaliteyi öngören ve transplantasyon önceliklendirmesinde kullanılan skor. Laboratuvar değerleri <1.0 ise 1.0 alınır; kreatinin en çok 4.0; sodyum 125–137 ile sınırlandırılır. Sonuç 6–40.",
        "A score predicting short-term mortality in end-stage liver disease, used for transplant prioritization. Lab values <1.0 are set to 1.0; creatinine is capped at 4.0; sodium is bounded 125–137. Result 6–40."],
 range:"6–40",
 form(){
   return [blk(t("Laboratuvar","Laboratory"),[
     num("bil",t("Total bilirubin (mg/dL)","Total bilirubin (mg/dL)"),{max:80,step:0.1}),
     num("inr",t("INR","INR"),{max:20,step:0.1}),
     num("cr",t("Serum kreatinin (mg/dL)","Serum creatinine (mg/dL)"),{max:25,step:0.1}),
     num("na",t("Serum sodyum (mmol/L)","Serum sodium (mmol/L)"),{val:137,min:100,max:170,step:1}),
     sel("dial",t("Son 1 haftada ≥ 2 kez diyaliz","Dialysis ≥ 2× in the last week"),[[0,t("Hayır","No")],[1,t("Evet","Yes")]])
   ],{cols:2})];
 },
 calc(v){
   const rb=+v("bil"),ri=+v("inr"),rc=+v("cr"),rn=+v("na");
   if(rb<=0||ri<=0||rc<=0||rn<=0)return{score:0,fmt:"—"};
   let bil=Math.max(rb,1),inr=Math.max(ri,1),cr=Math.max(rc,1);
   if(v("dial")==="1")cr=4;
   cr=Math.min(cr,4);
   let meld=Math.round(3.78*Math.log(bil)+11.2*Math.log(inr)+9.57*Math.log(cr)+6.43);
   const na=clamp(rn,125,137);
   let mn=meld;
   if(meld>11)mn=meld+1.32*(137-na)-0.033*meld*(137-na);
   mn=Math.round(clamp(mn,6,40));
   return {score:mn,fmt:String(mn),
     parts:[["MELD",String(meld)]],
     band:band(mn,[[9,"ok","Düşük (3 ay mortalite ≈ %2)","Low (≈2% 3-mo mortality)"],[19,"warn","Orta (≈ %6)","Moderate (≈6%)"],[29,"bad","Yüksek (≈ %20)","High (≈20%)"],[Infinity,"bad","Çok yüksek (> %50)","Very high (>50%)"]])};
 }
},

/* =====================================================================

const app=document.getElementById("app");
const findCalc=id=>CALCS.find(c=>c.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2000);
}

/* ---------- render router ---------- */
function render(){
  document.documentElement.lang=state.lang;
  document.getElementById("langBtn").textContent=state.lang==="tr"?"TR":"EN";
  document.getElementById("themeBtn").textContent=state.theme==="dark"?"☾":"☀";
  document.getElementById("disc").innerHTML=t(...UI.disc);
  document.getElementById("secCalcBtn").textContent=t(...CRIT_UI.calcNavLabel);
  document.getElementById("secCritBtn").textContent=t(...CRIT_UI.navLabel);
  document.getElementById("secCalcBtn").classList.toggle("on",state.section==="calc");
  document.getElementById("secCritBtn").classList.toggle("on",state.section==="crit");
  if(state.section==="crit"){
    if(state.critView==="detail"&&findCrit(state.critId))renderCritDetail();
    else renderCritHome();
  }else{
    if(state.view==="detail"&&findCalc(state.calc))renderDetail();
    else renderHome();
  }
  window.scrollTo(0,0);
}
function goSection(sec){state.section=sec;render();}

/* ---------- home ---------- */
function renderHome(){
  const searchFocused=document.activeElement&&document.activeElement.id==="q";
  const q=state.query.trim().toLowerCase();
  const cats=["all",...Object.keys(CATS).filter(k=>CALCS.some(c=>c.cat===k))];
  const list=CALCS.filter(c=>{
    if(state.cat!=="all"&&c.cat!==state.cat)return false;
    if(!q)return true;
    const hay=(c.name+" "+c.full.join(" ")+" "+CATS[c.cat].join(" ")).toLowerCase();
    return hay.includes(q);
  });
  app.innerHTML=`
    <div class="wrap">
      <div class="hero">
        <h1>DermaScores</h1>
        <p>${esc(t(...UI.tagline))} · ${CALCS.length} ${t("hesaplayıcı","calculators")}</p>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <input id="q" placeholder="${esc(t(...UI.search))}" value="${esc(state.query)}" autocomplete="off">
      </div>
      <div class="chips">
        ${cats.map(k=>`<button class="chip ${state.cat===k?"on":""}" data-cat="${k}">${
          k==="all"?esc(t(...UI.all)):esc(t(CATS[k][0],CATS[k][1]))}</button>`).join("")}
      </div>
      ${list.length?`<div class="grid">${list.map(cardHTML).join("")}</div>`
        :`<div class="empty">${esc(t(...UI.none))}</div>`}
    </div>`;

  const qi=document.getElementById("q");
  qi.oninput=()=>{state.query=qi.value;renderHome();};
  qi.onkeydown=e=>{if(e.key==="Enter")qi.blur();};
  if(searchFocused){qi.focus();const p=qi.value.length;qi.setSelectionRange(p,p);}
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;renderHome();});
  app.querySelectorAll(".ccard").forEach(b=>b.onclick=()=>openCalc(b.dataset.id));
}
function cardHTML(c){
  const col=CATS[c.cat][2];
  return `<button class="ccard" data-id="${c.id}" style="--cc:${col}">
    <span class="ab">${esc(c.name)}</span>
    <span class="fn">${esc(t(...c.full))}</span>
    <span class="tg">${esc(t(CATS[c.cat][0],CATS[c.cat][1]))}</span>
  </button>`;
}
function openCalc(id){state.view="detail";state.calc=id;render();}
function goHome(){state.section="calc";state.view="home";state.calc=null;render();}

/* ---------- detail ---------- */
function renderDetail(){
  const c=findCalc(state.calc),col=CATS[c.cat][2];
  const blocks=c.form()||[];
  app.innerHTML=`
    <div class="wrap" style="--cc:${col}">
      <button class="back" id="back">‹ ${esc(t(...UI.back))}</button>
      <div class="dhead">
        <h1>${esc(c.name)} <span class="tg">${esc(t(CATS[c.cat][0],CATS[c.cat][1]))}</span></h1>
        <div class="dfull">${esc(t(...c.full))}</div>
        <details class="about">
          <summary>${esc(t(...UI.about))}</summary>
          <div class="ab-body">${esc(t(...c.about))}
            ${c.range?`<div class="rg">${esc(t(...UI.range))}: ${esc(c.range)}</div>`:""}</div>
        </details>
      </div>
      <div class="ptrow"><input id="ptName" placeholder="${esc(t(...UI.patient))}" autocomplete="off"></div>

/* gather labelled values from the form for report/copy */
function gatherInputs(){
  const rows=[];
  document.querySelectorAll("#calcForm .block").forEach(blk=>{
    const sec=blk.querySelector(".bt");
    const flds=[...blk.querySelectorAll(".fld")];
    if(!flds.length)return;
    rows.push({sec:sec?sec.textContent:"",fields:flds.map(f=>{
      const ctrl=f.querySelector("[data-id]");
      let lbl=f.querySelector("span").textContent.trim();
      let val="";
      if(ctrl.tagName==="SELECT")val=ctrl.options[ctrl.selectedIndex].textContent;
      else val=ctrl.value;
      lbl=lbl.replace(/:\s*[\d.]+$/,"");
      return[lbl,val];

  });
  return rows;
}

/* =====================================================================
   DIAGNOSTIC CRITERIA ASSISTANT — engine
   ===================================================================== */
const findCrit=id=>CRITERIA.find(c=>c.id===id);
/* the criteria set currently shown (a disease may offer several, as tabs) */
const activeSet=c=>c.sets[Math.min(state.critSet,c.sets.length-1)];

/* points contributed by one item under the current selections */
function itemPts(it){
  if(it.type==="choice"){
    const o=it.options[critChoice[it.id]??0];
    return o?(o[2]||0):0;
  }
  return critChecked.has(it.id)?(it.points||0):0;
}

/* count-based sets expose groups; point-based sets render as one flat list */
function critGroupsOf(cs){
  if(cs.scoringType==="major-minor")return cs.groups;
  if(cs.scoringType==="mandatory-plus-n")return [
    {key:"mand",label:cs.mandatory.label,short:cs.mandatory.short,
     need:cs.mandatory.items.length,items:cs.mandatory.items},
    {key:"add", label:cs.additional.label,short:cs.additional.short,
     need:cs.additional.need,items:cs.additional.items}
  ];
  return null;
}

function evalCriteria(cs){
  const groups=critGroupsOf(cs);
  if(groups){
    let met=true;
    const detail=groups.map(g=>{
      const have=g.items.filter(it=>critChecked.has(it.id)).length;
      const ok=have>=g.need;
      if(!ok)met=false;
      return {key:g.key,short:g.short,have,need:g.need,total:g.items.length,ok};
    });
    return {met,detail};
  }
  const score=cs.items.reduce((s,it)=>s+itemPts(it),0);
  if(cs.scoringType==="points-banded"){
    /* bands are ordered ascending; the final band carries no `max` and catches the rest */
    const b=cs.bands.find(x=>x.max===undefined||score<=x.max)||cs.bands[cs.bands.length-1];
    return {met:!!b.met,score,bandLabel:b.label};
  }
  return {met:score>=cs.threshold,score,threshold:cs.threshold};
}

function updateCritResult(c){
  const cs=activeSet(c),r=evalCriteria(cs);
  const el=document.getElementById("critResult");
  let headline,detailHtml="";
  if(r.detail){
    r.detail.forEach(d=>{
      const gnEl=document.getElementById("gn_"+d.key);
      if(gnEl)gnEl.textContent=`${d.have}/${d.total} (${t("gerekli","need")}: ${d.need})`;
    });
    detailHtml=r.detail.map(d=>`${esc(t(...d.short))}: ${d.have}/${d.total}`).join(" · ");
    headline=r.met?"✅ "+esc(t(...CRIT_UI.met)):"⬜ "+esc(t(...CRIT_UI.notMet));
  }else if(cs.scoringType==="points-banded"){
    detailHtml=`${esc(t(...CRIT_UI.score))}: ${r.score}`;
    headline=(r.met?"✅ ":"⬜ ")+esc(t(...r.bandLabel));
  }else{
    detailHtml=`${esc(t(...CRIT_UI.score))}: ${r.score} / ${t("eşik","threshold")} ${r.threshold}`;
    headline=r.met?"✅ "+esc(t(...CRIT_UI.met)):"⬜ "+esc(t(...CRIT_UI.notMet));
  }
  el.className="crit-result"+(r.met?" met":"");
  el.innerHTML=`<div class="rv">${headline}</div><div class="rd">${detailHtml}</div>`;
}

/* one-line summary of a set's outcome, shared by the result box and the printout */
function critResultLine(cs,r){
  if(cs.scoringType==="points-banded")return `${t(...r.bandLabel)} — ${t(...CRIT_UI.score)}: ${r.score}`;
  let s=r.met?t(...CRIT_UI.met):t(...CRIT_UI.notMet);
  if(cs.scoringType==="points-threshold")s+=` — ${t(...CRIT_UI.score)}: ${r.score}/${r.threshold}`;
  else if(r.detail)s+=" — "+r.detail.map(d=>`${t(...d.short)} ${d.have}/${d.total}`).join(" · ");
  return s;
}

    </div>
    <div class="pr-meta">
      <b>${esc(t(c.name.tr,c.name.en))}</b> — ${esc(t(...CRIT_UI.criteriaSetLabel))}: ${esc(cs.name)}${cs.year?" ("+cs.year+")":""}<br>
      ${esc(t(...UI.date))}: ${esc(new Date().toLocaleString())}
    </div>
    <div class="pr-crit-groups">${groupsHtml}</div>
    <div class="pr-score">${esc(resultLine)}</div>
    <div class="pr-next">
      <h5>${esc(t(...CRIT_UI.workup))}</h5><ul>${c.nextSteps.workup.map(x=>`<li>${esc(t(...x))}</li>`).join("")}</ul>
      <h5>${esc(t(...CRIT_UI.treatment))}</h5><ul>${c.nextSteps.treatmentOrientation.map(x=>`<li>${esc(t(...x))}</li>`).join("")}</ul>
      <h5>${esc(t(...CRIT_UI.referral))}</h5><ul>${c.nextSteps.referralFlags.map(x=>`<li>${esc(t(...x))}</li>`).join("")}</ul>
      <h5>${esc(t(...CRIT_UI.differentials))}</h5><ul>${c.differentials.map(x=>`<li>${esc(t(...x))}</li>`).join("")}</ul>
    </div>
    <div class="pr-disc">${t(...CRIT_UI.banner).replace(/<\/?b>/g,"")}</div>`;
  window.print();
}

/* ---------- header controls ---------- */
document.getElementById("brand").onclick=goHome;
document.getElementById("secCalcBtn").onclick=()=>goSection("calc");
document.getElementById("secCritBtn").onclick=()=>goSection("crit");
document.getElementById("langBtn").onclick=()=>{state.lang=state.lang==="tr"?"en":"tr";render();};
document.getElementById("themeBtn").onclick=()=>{
  state.theme=state.theme==="dark"?"light":"dark";
  document.body.classList.toggle("light",state.theme==="light");
  document.querySelector('meta[name=theme-color]').content=state.theme==="dark"?"#0b1018":"#eef1f6";
  render();
};

/* ---------- start ---------- */
render();
</script>
</body>
</html>
